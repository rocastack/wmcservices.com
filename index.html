<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WMC Services</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden forms for Netlify detection -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="company" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="service" />
    </form>

    <form name="careers" netlify netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="availability" />
      <input name="lang" />
      <input name="linkedin" />
      <input name="portfolio" />
      <input name="cv" type="file" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
